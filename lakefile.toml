name = "naru"
version = "0.1.0"
defaultTargets = ["naru"]

# naru コンパイラ本体。字句解析・構文解析・名前解決・各種静的検査・backend を置く。
[[lean_lib]]
name = "Naru"
srcDir = "compiler"

# CLI: `lake exe naru compile [files...]` / `lake exe naru simulate <scenario>`
[[lean_exe]]
name = "naru"
root = "Main"
srcDir = "compiler"

# Model 用 stdlib(Lean 側)。生成 Model が import する。mathlib に依存しない。
[[lean_lib]]
name = "NaruStd"
srcDir = "stdlib/Model"

# 生成 Model(`lake exe naru compile` が `generated/Model.lean` と `generated/Model/**.lean` を出力する)。
# 機械生成専用。`lake build Model` でビルドする(C6)。
[[lean_lib]]
name = "Model"
srcDir = "generated"

# 生成 Statements(`lake exe naru compile` が `generated/Statements.lean` と `generated/Statements/**.lean` を出力する)。
# 機械生成専用。生成 Model だけを import する(Proofs は import しない)。`lake build Statements` でビルドする(C8)。
[[lean_lib]]
name = "Statements"
srcDir = "generated"

# scenario の実行ファイル(C7)。`lake exe naru simulate <dsl/…/scenario.naru>` が `generated/Simulate.lean`(`main`。追跡対象外)を
# 書いてから `lake build naru_simulate` で生成 Model ごと native にビルドし、`.lake/build/bin/naru_simulate` を実行する。
[[lean_exe]]
name = "naru_simulate"
root = "Simulate"
srcDir = "generated"

# 検査ドライバ: `lake exe naru_test grammar`(C16)/ `zed`(C17)/ `lsp`(C18)/ `zed-install`(C19)/ `golden`(C10)/ `statements`(C8 / C9)。Lean で書く(前提)。
# 検査本体は lean_lib `NaruTest`(`tests/NaruTest.lean` + `tests/NaruTest/*.lean`)、入口は `tests/NaruTestMain.lean`。
[[lean_lib]]
name = "NaruTest"
srcDir = "tests"

[[lean_exe]]
name = "naru_test"
root = "NaruTestMain"
srcDir = "tests"
