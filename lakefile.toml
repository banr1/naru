name = "naru"
version = "0.1.0"
defaultTargets = ["naru"]

# naru コンパイラ本体。字句解析・構文解析・名前解決・各種静的検査・backend を置く。
[[lean_lib]]
name = "Naru"
srcDir = "compiler"

# CLI: `lake exe naru compile [files...]` / `lake exe naru simulate <scenario>`
[[lean_exe]]
name = "naru"
root = "Main"
srcDir = "compiler"

# Model 用 stdlib(Lean 側)。生成 Model が import する。mathlib に依存しない。
[[lean_lib]]
name = "NaruStd"
srcDir = "stdlib/Model"

# 生成 Model(`lake exe naru compile` が `naru.toml` のソースルート(`specs/consensus`)から有効な生成先(`naru.toml` の `generated`、
# 既定 `generated/`)に `Model.lean` と `Model/**.lean` を出力する)。機械生成専用。`lake build Model` でビルドする(C6)。
# `srcDir` は `.lake/naru/generated`: `naru compile` / `naru simulate` が有効な生成先への symlink にする(追跡対象外)ので、
# `naru.toml` の `generated` を変えても lakefile を手で直さずに Lake が現在の生成先を読む(C24)。`lake build Model` の前に一度
# `lake exe naru compile` が要る。
[[lean_lib]]
name = "Model"
srcDir = ".lake/naru/generated"

# 生成 Statements(`lake exe naru compile` が有効な生成先に `Statements.lean` と `Statements/**.lean` を出力する)。
# 機械生成専用。生成 Model だけを import する(Proofs は import しない)。`lake build Statements` でビルドする(C8)。`srcDir` は Model と同じ link。
[[lean_lib]]
name = "Statements"
srcDir = ".lake/naru/generated"

# scenario の実行ファイル(C7)。`lake exe naru simulate <specs/consensus/…/scenario.naru>` が `.lake/naru/simulate/Simulate.lean`(`main`。
# 追跡対象外。C26: `generated/` には `naru compile` の決定的な出力だけを置く)を書いてから `lake build naru_simulate` で生成 Model ごと
# native にビルドし、`.lake/build/bin/naru_simulate` を実行する。
[[lean_exe]]
name = "naru_simulate"
root = "Simulate"
srcDir = ".lake/naru/simulate"

# naru の Core IR の独立した意味論とコンパイラ意味論保存の証明(C39〜C47)。`lake build NaruSem` が意味論・一般定理・
# 実生成物への接続証拠・公理監査を Lean kernel に検査させる(C45 の検査入口。`docs/testing.md`)。生成 Model / Statements からは
# import されない(不変条件の依存方向)。
[[lean_lib]]
name = "NaruSem"
srcDir = "semantics"

# プロトコル証明(C68〜C71): `proofs/` の各義務の theorem と補題(書き手の案内は `proofs/README.md`)。`naru.toml` の `proofs` が指す証明
# ディレクトリへの symlink `.lake/naru/proofs-src`(追跡対象外。`naru proofs` が置く)を `srcDir` にするので、Model / Statements と同じく
# lakefile を手で直さずに Lake が現在の設定の証明ディレクトリを読む。`globs` は `Proofs` とその配下の全モジュール(`Proofs.lean` と
# `Proofs/**.lean`。ルートが import しないモジュールもビルドする)。import してよいのは生成 Model / Statements・NaruStd・Lean 本体・mathlib だけ
# (不変条件の依存方向 Model ← Statements ← Proofs。手書きの `DecoupledConsensus*`・NaruSem・コンパイラ・NaruTest は不可)。
# `lake build Proofs` の前に一度 `lake exe naru proofs` が要る(link はそのとき作られる)。
[[lean_lib]]
name = "Proofs"
srcDir = ".lake/naru/proofs-src"
globs = ["Proofs.*"]

# 有界検査(C73 / C74): 生成 Model の具体的な run の上で、claim の前提・結論の有界版と証明の途中の中間命題を有限の horizon で判定する
# 検査器と、用語「共通の run の記述」から固定 seed の決定的な擬似乱数で run を組み立てる生成器(`tests/properties/`)。生成 Model と
# `NaruStd` だけを import し(mathlib なし)、`Proofs` からは import されない(`naru_test proofs` が閉包で確かめる)。`lake build Properties` が
# 検査器の Lake target(C74 の theorem もここに置く)。実行ファイル `naru_properties` は native にビルドして `naru_test properties` が走らせる。
[[lean_lib]]
name = "Properties"
srcDir = "tests/properties"

[[lean_exe]]
name = "naru_properties"
root = "PropertiesMain"
srcDir = "tests/properties"

# 検査ドライバ: `lake exe naru_test grammar`(C16)/ `zed`(C17)/ `lsp`(C18)/ `zed-install`(C19)/ `golden`(C10)/ `statements`(C8 / C9)/
# `repo`(C21 / C23 / C25)/ `regression`(C36。zed-install を除く上の全群と受理例・反例・C34 の意味・C1 / C6 / C7 / C8 / C24 / C26 を
# 1 コマンドで走らせる非対話の回帰一式)。Lean で書く(前提)。
# 検査本体は lean_lib `NaruTest`(`tests/NaruTest.lean` + `tests/NaruTest/*.lean`)、入口は `tests/NaruTestMain.lean`。
[[lean_lib]]
name = "NaruTest"
srcDir = "tests"

[[lean_exe]]
name = "naru_test"
root = "NaruTestMain"
srcDir = "tests"

# mathlib(前提「技術スタック」: v4.34.1。基準コミットの verified-consensus と同じ版)とその依存パッケージ。submodule `third_party/verified-consensus/`
# のビルド済みの `.lake/packages/` を path 依存で使い回す(複製も取得もしない。ネットワークは要らない)。使うのは `Proofs`(`proofs/`)だけで、
# 生成 Model / Statements・NaruStd・NaruSem・コンパイラ・`naru_test` の `proofs` 以外の群は mathlib を import しない。
# mathlib の依存パッケージを mathlib より先に書く(Lake は同名の依存を最初に解決したもので揃える: mathlib の lakefile が git で要求する
# 同名のパッケージも、この path のものが使われる)。版は submodule の `lake-manifest.json` が固定する。`lake update` は走らせない
# (mathlib の `post_update` がネットワークのキャッシュ取得を試みる): `lake-manifest.json` は手で同じ path の項目にしてある。
[[require]]
name = "batteries"
path = "third_party/verified-consensus/.lake/packages/batteries"

[[require]]
name = "Qq"
path = "third_party/verified-consensus/.lake/packages/Qq"

[[require]]
name = "aesop"
path = "third_party/verified-consensus/.lake/packages/aesop"

[[require]]
name = "proofwidgets"
path = "third_party/verified-consensus/.lake/packages/proofwidgets"

[[require]]
name = "Cli"
path = "third_party/verified-consensus/.lake/packages/Cli"

[[require]]
name = "importGraph"
path = "third_party/verified-consensus/.lake/packages/importGraph"

[[require]]
name = "LeanSearchClient"
path = "third_party/verified-consensus/.lake/packages/LeanSearchClient"

[[require]]
name = "plausible"
path = "third_party/verified-consensus/.lake/packages/plausible"

[[require]]
name = "mathlib"
path = "third_party/verified-consensus/.lake/packages/mathlib"
