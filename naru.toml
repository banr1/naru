# naru の設定(IDEAL.md C24)。`naru compile` / `naru simulate` / `naru lsp` / `naru deps` と検査ドライバ `naru_test` が読む。
# sources: コンパイル単位のソースルート。各ルート配下の **/*.naru が 1 つの単位で、モジュール名はルートからの相対パスに対応する
#          (specs/consensus/Consensus/Objects/Time.naru は Consensus.Objects.Time)。
# generated: `naru compile` が Model / Statements を書く生成先。
# deps: `naru deps` が依存グラフ(deps.json と閲覧用 index.html)を書く出力先(C63)。機械生成専用で追跡する。
sources = ["specs/consensus"]
generated = "generated"
deps = "docs/deps"
